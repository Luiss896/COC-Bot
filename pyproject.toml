[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cocbot"
version = "0.1.0"
description = "Agente di automazione visiva per Clash of Clans (GPGPC) - progetto personale/didattico"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TUO NOME" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "mss>=9.0",
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]
wgc = ["windows-capture>=1.5"]     # Windows Graphics Capture (da validare su questo PC)
dxgi = ["dxcam>=0.0.5"]            # fallback DXGI
gui = ["PySide6>=6.7"]
ocr = ["rapidocr-onnxruntime>=1.3"]
all-optional = ["cocbot[wgc,dxgi,gui,ocr]"]

[project.scripts]
cocbot = "cocbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/cocbot"]
