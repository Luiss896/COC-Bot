# ============================================================================
#  cocbot - configurazione di sviluppo
#  USO DIDATTICO. Automazione di Clash of Clans = violazione ToS Supercell.
#  Regole non negoziabili: MAI gemme, MAI acquisti, MAI guerre/CWL.
# ============================================================================
schema_version: 1
profile_name: "default"

device:
  # window = GPGPC consumer (default); adb = Google Play Games Developer Emulator
  backend: "window"
  window:
    process_name: "crosvm.exe"
    title_prefix: "Clash of Clans"      # non loggare il titolo completo (contiene l'account)
    launcher_process: "client.exe"
    launcher_title: "Google Play Games"
    pause_on_human_activity: true
    require_foreground_for_input: true
  adb:
    adb_path: ""                         # vuoto = cerca in PATH e nel Developer Emulator
    serial: "localhost:6520"             # default del Developer Emulator
    package: "com.supercell.clashofclans"
    connect_timeout_s: 60

ui:
  profile: "ui-2026.10"
  canonical_size: [1920, 1080]
  locale: "en"                           # gioco in inglese (consigliato per OCR/template)
  fail_on_fingerprint_mismatch: true

capture:
  backend: "wgc"                         # wgc | dxgi | mss | adb  (mss = fallback foreground)
  target_fps: 10
  black_frame_luma_threshold: 8.0
  stale_frame_timeout_s: 2.0
  save_dir: "out/captures"

input:
  # winmsg = messaggi Win32 alla finestra: il bot NON ruba focus ne' muove il cursore.
  # sendinput = click "reali" con focus forzato (interferisce: solo per test supervisionati).
  backend: "winmsg"
  jitter_ms: [60, 220]
  restore_cursor: true

safety:
  never_spend_gems: true                 # vincolo obbligatorio (non disattivabile)
  ban_iap_shop: true
  gem_counter_stable_frames: 2
  dry_run_default: true
  mode: "dry_run"                        # dry_run | supervised | autonomous
  # Limiti: null = illimitato (default). Si impostano a mano dalla GUI del bot.
  max_session_hours: null
  max_attacks_per_hour: null
  max_upgrades_per_hour: null
  # Auto-stop: mura tutte max + tutti i builder occupati + depositi pieni -> nulla da fare -> stop
  auto_stop_when_nothing_to_do: true
  night_pause: { enabled: true, start: "23:30", end: "08:00" }
  kill_switch:
    hotkey: "F12"
    esc_triple: true
    corner_failsafe: { enabled: true, corner: "top_left", hold_ms: 700 }
  panic_on:
    - gem_delta_nonzero
    - unknown_screen_streak
    - forbidden_tap_attempt

army:
  recipe_name: "Dragon Spam"
  expected_slots:
    troops: ["dragon", "balloon"]
    heroes: ["dragon_duke", "grand_warden"]
    spells: ["rage", "freeze"]
  max_army_cost: { gold: 0, elixir: 900000, dark: 0 }
  verify_before_battle: true
  min_reserve_for_army: { gold: 200000, elixir: 300000, dark: 5000 }

attack:
  strategy: "dragon_spam"
  # strategia esercito: usare gli eroi in battaglia? Se un eroe e' in upgrade non e'
  # schierabile: con heroes_require_ready=true la battaglia evita/spetta gli eroi non pronti.
  use_heroes: true
  heroes_require_ready: true
  early_exit:
    enabled: true
    loot_target: { gold: 250000, elixir: 250000, dark: 1500 }
    max_battle_duration_s: 90
    exit_when_army_exhausted: true
  max_battle_duration_s: 180
  retry_on_error: 2
  # cap delle storage note (HUD): con storage piene il bottino in eccesso va perso, quindi
  # il bot evita di sprecare raid/ricerche quando oro+elisir sono al cap.
  respect_storage_caps: true
  storage_cap_gold: 10000000
  storage_cap_elixir: 10000000
  storage_cap_dark: 200000
  # con oro/elisir al cap (bottino non incassabile) attacca comunque se il dark basta
  attack_for_dark_when_full: true

loot:
  thresholds:
    gold_min: 350000
    elixir_min: 350000
    dark_min: 2000
    score_min: 800000
  weights: { gold: 1.0, elixir: 1.0, dark: 100.0 }
  max_skip_per_attack: 40
  skip_timeout_s: 120
  max_th_delta: 1
  skip_if_unreadable: true

upgrade:
  enabled: true
  preset: "balanced_th18"
  queue: []
  # ordine di priorita' delle categorie (scelto dall'utente il 3 nov):
  # mura -> difese -> offensiva -> eroi -> risorse
  priority: ["walls", "defense", "army", "heroes", "resources", "other"]
  reserves: { gold: 200000, elixir: 200000, dark: 3000 }
  max_upgrades_per_cycle: 3
  use_lab: true
  use_heroes: true
  # mura: supportate dall'engine (pannello azioni "Wall Upgrader": Upgrade oro o elisir);
  # rispettano walls.max_wall_batches_per_cycle e richiedono un builder libero.
  include_walls: true
  # dry_run: legge la lista ed emette il piano, non preme mai CONFIRM/Upgrade.
  # Mettere false solo dopo aver verificato il piano con `python -m cocbot upgrade-scan`.
  dry_run: true
  ignore_categories: []
  verify_after_upgrade: true
  max_scan_scrolls: 45

walls:
  mode: "check_only"                     # off | check_only | walls_first_excess | gate_before_th | strict_walls
  check_before_upgrades: true
  wall_upgrader_flow: true
  max_wall_batches_per_cycle: 3
  reserve_for_buildings: { gold: 100000, elixir: 100000 }
  # Preset A: un builder resta libero e riservato alle mura (upgrade mura istantaneo);
  # gli altri builder lavorano. Preset B (automatico): quando tutte le mura sono al massimo
  # tutti i builder possono lavorare.
  reserve_builder_for_walls: true
  switch_to_all_builders_when_walls_max: true
  auto_stop_when_walls_max: true
  # NOTA: "Select ROW" / "Upgrade MORE" (upgrade multiplo di muri) NON sono supportati:
  # decisione e condizioni per introdurli in docs/ADR-006-bulk-walls-decisione.md.
  # Si aggiornano al massimo `max_wall_batches_per_cycle` muri per ciclo, uno alla volta.

scheduler:
  farm_phase_minutes: 45
  upgrade_phase_minutes: 10
  idle_check_minutes: 10
  max_cycles_per_session: 6

humanize:
  # Anti-ban/humanization: rende i ritmi meno regolari. NON garantisce l'immunita' dal ban.
  enabled: true
  timing_jitter: true
  random_idle_breaks: true
  action_delay_ms: [350, 1200]        # ritardo tra azioni (distribuzione sbilanciata verso il basso)
  min_seconds_between_actions: 0.25
  break_probability: 0.02             # pausa breve casuale per azione
  break_duration_s: [8, 45]
  long_break_every_min: 25            # pausa lunga periodica (minuti)
  long_break_duration_s: [60, 180]
  idle_tap_probability: 0.05          # tap occasionali su erba vuota (mai su gemme/shop)
  max_actions_per_minute: 30          # rate limit di sicurezza
  max_same_target_repeats: 8          # allarme se lo stesso punto viene ripetuto troppe volte

telemetry:
  log_level: "INFO"
  log_dir: "logs"
  sqlite_path: "data/cocbot.sqlite"
  keep_screenshots_days: 7

gui:
  language: "it"
  theme: "dark"
  debug_overlay: true
  # hotkey globale start/stop del bot (Ctrl+Alt+L; Ctrl+L da solo ruberebbe i browser)
  hotkey_start_stop: "ctrl+alt+l"
  # kill switch globale: ferma subito il bot (F12 è occupato su questo PC)
  hotkey_kill: "ctrl+alt+k"
